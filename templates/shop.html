{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه ممبر</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* تنظیمات برای نمایش ۴ تایی */
        .products {
            display: flex;
            flex-wrap: wrap; /* اگر جا نشدند، به خط بعد می‌روند */
            justify-content: center; 
            gap: 15px; /* فاصله بین کارت‌ها */
            padding: 20px;
        }

        .product-card {
            /* فرمول برای ۴ تایی شدن: (۱۰۰ درصد تقسیم بر ۴) منهای فضا برای Gap */
            flex: 0 1 calc(25% - 20px); 
            min-width: 220px; /* جلوگیری از خیلی کوچک شدن در موبایل */
            box-sizing: border-box;
        }

        /* برای اینکه در موبایل محصولات ۲ تایی یا ۱ تایی شوند و خوانا بمانند */
        @media (max-width: 768px) {
            .product-card {
                flex: 0 1 calc(50% - 20px);
            }
        }
        @media (max-width: 480px) {
            .product-card {
                flex: 0 1 100%;
            }
        }
    </style>
</head>
<body>



    </div>

    <div class="shop-container">
        <div class="category">
            
                    
            <di class="products">           


                </div>

            </div> <!-- پایان products -->
        </div> <!-- پایان category -->
    </div> <!-- پایان shop-container -->

</body>
</html>
